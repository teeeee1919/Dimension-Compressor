<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Dimension Compressor</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: #fff; text-align: center; padding: 20px; }
    h1 { color: #4e9caf; }
    .status-panel { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; background: #2b2b36; padding: 15px; border-radius: 10px; }
    .stat { font-size: 18px; font-weight: bold; }
    
    .game-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .zone { width: 300px; min-height: 250px; background: #2b2b36; border-radius: 10px; padding: 15px; border: 2px solid #3f3f52; }
    .zone.locked { opacity: 0.5; filter: grayscale(1); }
    
    button { padding: 10px 15px; font-size: 14px; cursor: pointer; border-radius: 6px; border: none; background-color: #4e9caf; color: white; margin: 5px; font-weight: bold; }
    button:disabled { background-color: #555; cursor: not-allowed; }
    
    .progress-bar-container { width: 100%; background-color: #444; border-radius: 5px; margin: 10px 0; height: 12px; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background-color: #4caf50; transition: width 0.05s linear; }
  </style>
</head>
<body>

  <h1>Dimension Compressor</h1>

  <!-- 상단 자원 및 레벨 정보 -->
  <div class="status-panel">
    <div class="stat">Level: <span id="level">1</span> (XP: <span id="xp">0</span>)</div>
    <div class="stat">Dust: <span id="dust">0</span></div>
    <div class="stat" id="shardContainer" style="display:none;">Shard: <span id="shard">0</span></div>
  </div>

  <div class="game-container">
    <!-- 구역 1: Dust 존 -->
    <div class="zone">
      <h2>1D Dust Zone</h2>
      <p id="dustStatus">Dust 재생산 중...</p>
      
      <div class="progress-bar-container">
        <div id="miningBar" class="progress-bar"></div>
      </div>

      <button id="mineBtn" disabled>Dust 채굴하기</button>
      <hr style="border-color: #444; margin: 15px 0;">

      <!-- 해금 및 업그레이드 버튼 -->
      <div id="unlockShardBox">
        <button id="unlockShardBtn">Shard 해금 (Dust 30)</button>
      </div>
      <div id="unlockXpBox">
        <button id="unlockXpBtn">XP 해금 (Dust 50)</button>
      </div>

      <br>
      <button id="upgradeSpeedBtn">채굴 속도 업그레이드 (Dust 5)</button>
      <br>
      <button id="mainUpgradeBtn" style="display:none;">차원 업그레이드 (Shard 3)</button>
    </div>

    <!-- 잠긴 구역 2 -->
    <div id="zone2" class="zone locked">
      <h2>Locked Zone</h2>
      <p>잠김 (Level 5 필요)</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
